<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 02</title>
    <style>
        p {
            font-size: 14px;
        }

        @media only screen and (min-width: 768px) {
            p {
                font-size: 18px;
            }
        }

        @media only screen and (min-width: 1200px) {
            p {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <p>Redimensione a janela do navegador.
    </p>
</body>

</html>
