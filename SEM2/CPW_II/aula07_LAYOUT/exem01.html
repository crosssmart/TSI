<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 01</title>
    <style>
        body {
            background-color: lightgreen;
        }

        @media only screen and (max-width: 600px) {
            body {
                background-color: lightblue;
            }
        }
    </style>
</head>

<body>
    <p>Redimensione a janela do navegador.
        Quando a largura do documento for de 600 pixels ou menos, a cor de fundo
        será 'lightblue'. Caso contrário, será "lightgreen";
    </p>
</body>

</html>
