<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <button id="alertaBtn">Mostrar Alerta</button>

  <script>
    const btn = document.getElementById('alertaBtn');
    function mostrarMensagem() {
      alert('Botão Clicado!');
    }
    btn.addEventListener('click', mostrarMensagem);
  </script>
</body>

</html>
