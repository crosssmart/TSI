<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício07</title>
</head>

<body>
    <form id="form">

        <label for="name">Nome</label><br>
        <input type="text" name="name" id="nome">

        <br><br>

        <label for="email">E-mail</label><br>
        <input type="email" name="email" id="email">

        <br><br>

        <label for="senha">Senha</label><br>
        <input type="password" name="senha" id="senha">

        <br><br>

        <label for="numero">Número de Telefone</label><br>
        <input type="tel" name="numero" id="numero">

        <br><br>

        <button onclick="mostrarValores()">Enviar</button>
    </form>


    <script>
        function mostrarValores() {
            let nome = document.getElementById("nome").value
            let email = document.getElementById("email").value
            let senha = document.getElementById("senha").value
            let telefone = document.getElementById("numero").value


            alert("Nome: " + nome + "\nE-mail: " + email + "\nSenha: " + senha + "\nTelefone: " + telefone)
        }
    </script>
</body>

</html>
