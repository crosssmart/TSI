<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2</title>
</head>

<body>
    <h1 id="texto">Este texto irá mudar clique no botão abaixo</h1>

    <button onclick="mudar()">Clique Aqui!</button>


    <script>
        function mudar() {
            let el = document.getElementById("texto")

            el.textContent = "Mudou o Texto!"
        }
    </script>
</body>

</html>
