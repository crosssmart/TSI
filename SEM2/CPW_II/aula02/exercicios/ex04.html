<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 04</title>
    <style>
        #quadrado {
            width: 300px;
            height: 300px;
            background-color: aqua;
            position: relative;
            top: 0;
            left: 0;
            transition: all 1s ease;
        }
    </style>
</head>

<body>
    <div id="quadrado"></div>
    <br>
    <button onclick="mover()">Mover Quadrado</button>

    <script>
        function voltar() {
            let quad = document.getElementById("quadrado")
            quad.style.left = "0"
            quad.style.top = "0"
        }


        function mover() {
            let quad = document.getElementById("quadrado")
            quad.style.left = "200px"
            quad.style.top = "50px"

            setTimeout(voltar, 2000)
        }
    </script>
</body>

</html>
