<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula02</title>
</head>

<body>
    <p id="demo" style="display: none;">Hello World</p>

    <button type="button" onclick="document.getElementById('demo').style.fontSize='35px'">Aumenta!</button>
    <button type="button" onclick="document.getElementById('demo').style.display='block'">Mostra!</button>
    <button type="button" onclick="document.getElementById('demo').style.display='none'">Esconde!</button>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            alert("A página foi carregada!")
        })
    </script>
</body>

</html>
