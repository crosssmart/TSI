<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste05</title>
</head>

<body>

    <button onclick="doSomething()">Aperte</button>


    <script>
        function doSomething() {
            const linguagem = "Javascript";
            let text = "";
            for (let x of linguagem) {
                text += `${x} `
            }
            alert(`${linguagem}\n${text}`)
        }
    </script>
</body>

</html>
