<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>EAD IFMS</title>
</head>

<body>
    <header>
        <nav>
            <div>
                <a href="https://ifms.edu.br" target="_blank">
                    <img src="https://ead.ifms.edu.br/pluginfile.php/1/theme_moove/logo/1699458447/banner%20topo%20capa%20sem%20brasao.jpg"
                        alt="">
                </a>
            </div>
        </nav>
    </header>
    <main>
        <div class="bg">
            <divc class="inv"></divc>
            <div class="card">
                <h3>Acesso à plataforma</h3>
                <form action="">
                    <label for="name">Identifique o Usuário</label><br>
                    <div class="input-group">
                        <div class="alg"></div>
                        <input type="text" name="name" id="name" placeholder="Identificação de Usuário">
                    </div>

                    <br>

                    <label for="senha">Senha</label><br>
                    <div class="input-group">
                        <div class="alg"></div>
                        <input type="password" name="senha" id="senha" placeholder="Senha">
                    </div>

                    <button>Acessar</button>
                </form>
                <a id="esq" href="#">Esqueceu o seu usuário ou senha?</a>
            </div>
        </div>
    </main>
</body>

</html>
