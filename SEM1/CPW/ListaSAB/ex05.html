<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            text-align: center;
        }

        section {
            display: flex;
            flex-direction: row;
        }

        figure {
            width: 300px;
            height: 490px;
            border: solid 1px black;
            border-radius: 10px;
            box-shadow: 10px 10px rgba(0, 0, 0, 0.36);
        }

        img:hover {
            height: 350px;
            transition: 0.3s;
        }

        figcaption {
            margin: 10px;
        }
    </style>
</head>

<body>
    <section>
        <figure>
            <img src="https://static.wikia.nocookie.net/ordemparanormal/images/e/ec/Arte_de_Mutilador_Noturno_em_Natal_Macabro.png/revision/latest?cb=20241223172157&path-prefix=pt-br"
                alt="Aguiar" height="300px">
            <figcaption>
                Delegado Jonas Aguiar, também conhecido como Mutilador Noturno, é um assassino em série, um dos
                antagonistas do especial Natal Macabro e um dos protagonistas da série Ordem Paranormal, presente em
                Hexatombe.
            </figcaption>
        </figure>
        <figure>
            <img src="https://static.wikia.nocookie.net/ordemparanormal/images/4/46/Arte_de_Jae_em_Natal_Macabro.png/revision/latest?cb=20241228152827&path-prefix=pt-br"
                alt="Jae" height="300px">
            <figcaption>
                Jae-Yoon, também conhecide apenas como Jae ou X, é uma assassina em série, um dos antagonistas do
                especial Natal Macabro
                e um dos protagonistas da série Ordem Paranormal, presente em Hexatombe.
            </figcaption>
        </figure>
        <figure>
            <img src="https://static.wikia.nocookie.net/ordemparanormal/images/5/54/Arte_de_Labirinto_em_Hexatombe.png/revision/latest?cb=20251026032829&path-prefix=pt-br"
                alt="labirinto" height="300px">
            <figcaption>
                Labirinto é um ocultista que possui uma intensa obsessão por labirintos e por seus formatos. Ele teve
                sua primeira
                aparição no final da 3ª parte de Natal Macabro, tendo sido mostrada apenas sua silhueta, junto dos
                outros assassinos.
            </figcaption>
        </figure>
        <figure>
            <img src="https://static.wikia.nocookie.net/ordemparanormal/images/e/e5/Arte_de_Kemi_em_Hexatombe.png/revision/latest?cb=20251026032811&path-prefix=pt-br"
                alt="kemi" height="300px">
            <figcaption>
                Kemi é uma mercenária, matando pessoas por dinheiro. Ela teve sua primeira aparição no final da 3ª parte
                de Natal
                Macabro, sendo mostrada apenas sua silhueta, junto dos outros assassinos.
            </figcaption>
        </figure>
    </section>
</body>

</html>
