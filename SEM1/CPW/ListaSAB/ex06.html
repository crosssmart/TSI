<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table {
            border-collapse: collapse;
        }

        tr {
            text-align: center;
        }

        td,
        th {
            padding: 15px;
            border: solid 0.5px black;
        }

        th {
            background-color: rgb(138, 138, 255);
            font-weight: bold;
        }
    </style>
</head>

<body>
    <main>
        <table>
            <thead>
                <tr>
                    <th>Básico</th>
                    <th>Pro</th>
                    <th>Enterprise</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>100</td>
                    <td>350</td>
                    <td>500</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>

</html>
