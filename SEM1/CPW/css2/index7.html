<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
            width: 500px;
            height: 500px;
            position: absolute;
            top: 100px;
            left: 100px;
            background-color: aquamarine;
        }

        .icone {
            position: absolute;
            top: 0px;
            left: 90%;
            width: 50px;
            height: 50px;
            background-color: red;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icone"></div>
    </div>
</body>

</html>
