<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="#" method="post">
        <label for="nomeUsuario">Nome de Usuário</label>
        <input type="text" name="nomeUsuario" id="nomeUsuario" required minlength="4" pattern="[a-z0-9]{4,}">

        <br><br>

        <label for="email">E-mail</label>
        <input type="email" name="email" id="email" required>

        <br><br>

        <label for="senha">Senha</label>
        <input type="password" name="senha" id="senha" minlength="8">

        <br><br>

        <label for="data">Data de Nascimento</label>
        <input type="date" name="data" id="data" required>

        <br><br>

        <label for="terms">Termos de Serviço</label>
        <input type="checkbox" name="terms" id="terms" required>

        <br><br>

        <button type="submit">Enviar (mesmo inválido)</button>
    </form>
</body>

</html>
