<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:link {
            color: #2980b9;
            text-decoration: underline;
        }

        a:visited {
            color: #8e44ad;
        }

        a:hover {
            color: red;
            text-decoration: none;
        }

        a:active {
            color: #f39c12;
        }

        .alerta {
            color: red;
            border: 1px solid red;
        }

        .destaque {
            background-color: #ffeeee;
        }

        #cabecalho-principal {
            background-color: #333;
            color: white;
        }
    </style>
</head>

<body>
    <header id="cabecalho-principal">
        <h1>Meu site</h1>
    </header>
    <p class="alerta">Cuidado: Informação volátil.</p>
    <div class="alerta destaque">
        <p>Isto é um alerta com destaque</p>
    </div>

    <a href="#">coisas</a>
</body>

</html>
